<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Novembro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1080px;height:1350px;box-sizing:border-box;padding:84px 88px 72px;display:flex;flex-direction:column;background:#0B1F3A;color:#EAF0F7;font-family:'Archivo',sans-serif;overflow:hidden">
<div style="display:flex;justify-content:space-between;align-items:center;font-size:26px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#9DBBFF">
<span>Novembro Azul</span>
<span>8 / 10</span>
</div>
<div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0;padding:48px 0 36px">
<h1 style="margin:0;font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:800;font-size:92px;line-height:1.02;letter-spacing:-.005em;color:#EAF0F7">Novembro é mês de ir ao médico.</h1>
<div>
<div style="display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px;font-size:26px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#B9C8E0">
<span>Novembro</span>
<span>2026</span>
</div>
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:24px;font-weight:600;letter-spacing:.14em;color:#B9C8E0;padding-bottom:10px">
<span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
</div>
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr))">
<sc-for list="{{days}}" as="d" hint-placeholder-count="35">
<div style="border-top:2px solid rgba(157,187,255,.35);height:62px;padding-top:8px;box-sizing:border-box;font-size:32px;font-weight:600;color:#9DBBFF">{{d.n}}</div>
</sc-for>
</div>
</div>
<div>
<p style="margin:0 0 14px;font-weight:600;font-size:46px;line-height:1.16;color:#EAF0F7">Fazer o check-up. Falar da próstata com o próprio médico.</p>
<p style="margin:0;font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:400;font-size:58px;line-height:1.1;color:#9DBBFF">E falar também do assunto que ele sempre guarda.</p>
</div>
</div>
<div style="border-top:2px solid rgba(234,240,247,.28);padding-top:26px;font-size:28px;font-weight:500;letter-spacing:.01em;color:#B9C8E0">Dr. Cristiano Estivalet, MÉDICO, CRM-DF 15471</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
renderVals() {
// Novembro de 2026: começa num domingo e tem 30 dias.
const days = Array.from({ length: 35 }, (_, i) => ({ n: i < 30 ? String(i + 1) : '' }));
return { days };
}
}
</script>
</body>
</html>
