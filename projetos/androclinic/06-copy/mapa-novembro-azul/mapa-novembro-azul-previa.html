<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mapa de Risco Novembro Azul — prévia</title>
<base href="https://andromens.com.br/">
<script>try{const r=history.replaceState.bind(history);history.replaceState=function(){try{r.apply(history,arguments)}catch(e){}}}catch(e){}</script>
<style>
/* css_mapa.css */
@font-face{font-family:"Mulish";src:url("data:,") format("truetype");font-weight:200 1000;font-display:swap}

:root{
  --azul:#4F98FF;
  --roxo:#9E43FF;
  --roxo-texto:#5B2BD9;
  --icone:#6E55FF;
  --grad:linear-gradient(135deg,#4F98FF 0%,#9E43FF 100%);
  --tinta:#15181C;
  --texto-2:#454A53;
  --texto-3:#666C76;
  --cinza:#A1A3A4;
  --linha:#E3E6EE;
  --linha-card:#EEF0F5;
  --trilho:#ECEEF4;
  --lavanda:#F5F0FF;
  --baixo:#1E9E57;   --baixo-tx:#0B6B38;   --baixo-bg:#E6F6EC;   --baixo-borda:#BFE6CF;
  --atencao:#F0A91B; --atencao-tx:#7A4D00; --atencao-bg:#FFF4D6; --atencao-borda:#F3D68A;
  --alto:#E2483D;    --alto-tx:#A3221A;    --alto-bg:#FDE9E7;    --alto-borda:#F2BAB4;
  --raio-card:24px;
  --raio-opcao:18px;
  --raio-campo:16px;
  --sombra-card:0 12px 32px rgba(38,56,110,.08),0 2px 6px rgba(38,56,110,.04);
  --sombra-btn:0 12px 26px rgba(106,84,255,.30);
}

*{box-sizing:border-box;margin:0;padding:0}
button,input{font-family:inherit}

/* Tela: no produto é o <body> (max-width 480px, centralizado, min-height 100dvh) */
.tela{position:relative;overflow:hidden;width:390px;height:844px;background:#fff;color:var(--tinta);
  font-family:"Mulish",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.tela--longa{height:auto}
.brilho{position:absolute;left:0;right:0;top:0;height:440px;pointer-events:none;
  background:radial-gradient(90% 70% at 8% 0%,rgba(79,152,255,.17) 0%,rgba(79,152,255,0) 70%),
             radial-gradient(80% 60% at 96% 4%,rgba(158,67,255,.14) 0%,rgba(158,67,255,0) 70%)}
.corpo{position:relative;padding:10px 20px 136px}
.corpo--centro{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-top:0;padding-bottom:120px}

.ic{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grad-tx{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Tipografia */
.titulo{font-weight:900;font-size:34px;line-height:1.12;letter-spacing:-.02em;text-align:center}
.pergunta{margin-top:30px;font-weight:800;font-size:28px;line-height:1.22;letter-spacing:-.015em}
.ajuda{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:700;font-size:17px;color:var(--texto-3)}
.ajuda .ic{width:20px;height:20px;color:var(--icone)}

/* Topo: voltar + contador + barra de progresso */
.topo{display:flex;align-items:center;justify-content:space-between;height:52px}
.voltar{display:inline-flex;align-items:center;gap:2px;height:44px;margin-left:-8px;padding:0 12px 0 4px;border:0;border-radius:12px;background:none;
  font-weight:700;font-size:17px;color:var(--texto-2);cursor:pointer}
.voltar .ic{width:26px;height:26px;stroke-width:2.2}
.passo{font-weight:700;font-size:17px;color:var(--texto-3)}
.passo b{font-weight:900;color:var(--tinta)}
.progresso{height:8px;border-radius:999px;background:var(--trilho);overflow:hidden}
.progresso>i{display:block;height:100%;border-radius:inherit;background:var(--grad)}

/* Opções (escolha única = radio, múltipla = checkbox) */
.opcoes{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.opcao{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:14px 18px;border:2px solid var(--linha);border-radius:var(--raio-opcao);
  background:#fff;box-shadow:0 2px 8px rgba(38,56,110,.04);font-weight:700;font-size:20px;line-height:1.25;color:var(--tinta);text-align:left;cursor:pointer}
.opcao .marca{flex:0 0 28px;width:28px;height:28px;display:grid;place-items:center;border:2px solid #C5CBD6;border-radius:50%;background:#fff}
.opcoes--multi .opcao .marca{border-radius:9px}
.opcao.sel{border-color:transparent;background:linear-gradient(var(--lavanda),var(--lavanda)) padding-box,var(--grad) border-box;box-shadow:0 10px 22px rgba(106,84,255,.14)}
.opcao.sel .marca{border:0;background:var(--grad)}
.opcao.sel .marca::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.opcoes--multi .opcao .marca svg{display:none;width:18px;height:18px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.opcoes--multi .opcao.sel .marca::after{display:none}
.opcoes--multi .opcao.sel .marca svg{display:block}
.opcao--nenhum{margin-top:6px}

/* Rodapé fixo com o botão principal (no produto: position:fixed + env(safe-area-inset-bottom)) */
.rodape{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 28px;background:linear-gradient(to bottom,rgba(255,255,255,0) 0,#fff 26px)}

/* Botões */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;padding:14px 22px;border:0;border-radius:999px;
  font-weight:800;font-size:20px;line-height:1.2;letter-spacing:.005em;text-align:center;text-decoration:none;cursor:pointer}
.btn .ic{width:24px;height:24px;stroke-width:2.2}
.btn--primario{background:var(--grad);color:#fff;box-shadow:var(--sombra-btn)}
.btn--primario:disabled,.btn--primario.desab,.btn--primario[aria-disabled="true"]{background:#E8EAF0;color:#8B919B;box-shadow:none;cursor:default}
.btn--secundario{padding:14px 16px;background:#fff;color:var(--tinta);border:2px solid var(--linha);font-size:18px}
.btn--branco{background:#fff;color:var(--roxo-texto);box-shadow:0 10px 22px rgba(20,10,80,.18)}
.btn--zap .ic{color:#25D366}

/* Abertura */
.logo{display:block;width:auto;height:26px;margin:0 auto}
.anel-hero{display:block;width:260px;height:260px;margin:22px auto 10px}
.infos{display:flex;flex-direction:column;gap:12px;width:max-content;margin:26px auto 0;list-style:none}
.infos li{display:flex;align-items:center;gap:12px;font-weight:600;font-size:19px;color:var(--texto-2)}
.bola{flex:0 0 42px;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--lavanda);color:var(--icone)}

/* Contato */
.campos{display:flex;flex-direction:column;gap:22px;margin-top:28px}
.campo__rotulo{display:block;margin-bottom:10px;font-weight:800;font-size:18px}
.campo__caixa{display:flex;align-items:center;gap:10px;height:64px;padding:0 20px;border:2px solid var(--linha);border-radius:var(--raio-campo);background:#fff}
.campo__caixa input{flex:1;min-width:0;border:0;outline:0;background:none;font-weight:700;font-size:22px;color:var(--tinta)}
.campo__caixa input::placeholder{font-weight:600;color:#A6ABB4}
.campo__caixa--foco{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box;box-shadow:0 0 0 5px rgba(130,110,255,.12)}
.campo__caixa--erro{border-color:var(--alto);box-shadow:0 0 0 5px rgba(226,72,61,.10)}
.campo__sufixo{font-weight:700;font-size:18px;color:var(--texto-3)}
.campo__erro{display:block;margin-top:8px;font-weight:700;font-size:16px;color:var(--alto-tx)}
/* o atributo hidden tem que vencer o display das classes (senão o erro aparece antes da hora) */
.campo__erro[hidden],.mais-opcoes[hidden],.painel[hidden],.painel-fundo[hidden]{display:none}
.nota{display:flex;align-items:center;gap:10px;margin-top:24px;font-weight:600;font-size:17px;color:var(--texto-3)}
.nota .ic{color:var(--icone)}

/* Consentimento (LGPD): caixa de autorização na tela de contato, entre a nota de sigilo e o botão.
   O texto e a versão são do arquivo da Duda (consentimento-mapa-risco.md): não editar aqui. */
.consent-wrap{margin-top:20px;scroll-margin:24px 0 150px}
.consent{position:relative;display:flex;align-items:flex-start;gap:14px;padding:16px 16px 16px 14px;border:2px solid var(--linha);border-radius:var(--raio-opcao);
  background:#fff;box-shadow:0 2px 8px rgba(38,56,110,.04);cursor:pointer;-webkit-tap-highlight-color:transparent}
.consent input{position:absolute;z-index:1;left:14px;top:17px;width:28px;height:28px;margin:0;opacity:0}
.consent__caixa{flex:0 0 28px;width:28px;height:28px;margin-top:1px;display:grid;place-items:center;border:2px solid #7D8592;border-radius:8px;background:#fff;pointer-events:none}
.consent__caixa svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.consent__texto{font-weight:600;font-size:18px;line-height:1.5;color:var(--tinta)}
.consent.sel{border-color:transparent;background:linear-gradient(var(--lavanda),var(--lavanda)) padding-box,var(--grad) border-box;box-shadow:0 10px 22px rgba(106,84,255,.14)}
.consent.sel .consent__caixa{border:0;background:var(--grad)}
.consent.sel .consent__caixa svg{opacity:1}
.consent input:focus-visible+.consent__caixa{outline:3px solid var(--roxo);outline-offset:3px}
.consent--erro{border-color:var(--alto);background:#FFF7F6;box-shadow:0 0 0 5px rgba(226,72,61,.10)}
.consent--erro .consent__caixa{border-color:var(--alto)}
.consent-wrap .campo__erro{margin-top:10px}
/* link "como meus dados são usados": degradê escurecido (o azul claro do degradê não passa contraste em texto de 18px) */
.link-dados{padding:6px 0;margin:-6px 0;font-weight:800;color:var(--roxo-texto);background:linear-gradient(90deg,#2F6FE0,#7B2FE0);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-decoration:underline;text-decoration-color:#7A5CFF;text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer}
@media (forced-colors:active){.link-dados{-webkit-text-fill-color:LinkText;background:none}}

/* Painel "Como usamos suas respostas": folha por cima do formulário, que continua preenchido por baixo.
   No produto: .painel e .painel-fundo com position:fixed e a página travada (overflow:hidden) enquanto aberto.
   O painel traz a própria fonte porque costuma ficar fora da .tela (irmão do #app). */
.painel-fundo{position:absolute;inset:0;z-index:40;background:rgba(21,24,28,.48)}
.painel{position:absolute;left:0;right:0;top:24px;bottom:0;z-index:41;display:flex;flex-direction:column;max-width:480px;margin:0 auto;
  font-family:"Mulish",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -16px 40px rgba(21,24,28,.22);overflow:hidden;animation:sobe .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sobe{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.painel{animation:none}}
.painel__topo{flex:0 0 auto;display:flex;align-items:center;height:60px;padding:0 20px;border-bottom:1px solid var(--linha-card)}
.painel__corpo{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:22px 20px calc(28px + env(safe-area-inset-bottom))}

/* Texto da página de privacidade (painel e página /mapa/privacidade): fonte grande, texto corrido, títulos em negrito */
.priv__ic{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:var(--lavanda);color:var(--icone)}
.priv__ic .ic{width:28px;height:28px}
.priv h1{margin-top:14px;font-weight:900;font-size:28px;line-height:1.2;letter-spacing:-.015em}
.priv h2{margin-top:28px;font-weight:900;font-size:20px;line-height:1.25}
.priv p{margin-top:10px;font-weight:500;font-size:18px;line-height:1.6;color:var(--texto-2)}
.priv ol{display:flex;flex-direction:column;gap:12px;margin-top:12px;list-style:none}
.priv li{position:relative;padding-left:40px;font-weight:500;font-size:18px;line-height:1.55;color:var(--texto-2)}
.priv li .n{position:absolute;left:0;top:0;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--lavanda);
  font-weight:900;font-size:15px;color:var(--roxo-texto)}
.priv p.priv__destaque{display:flex;align-items:flex-start;gap:12px;margin-top:22px;padding:16px;border-radius:16px;background:var(--lavanda);
  font-weight:800;line-height:1.45;color:var(--tinta)}
.priv__destaque .ic{margin-top:1px;color:var(--icone)}
.priv a{font-weight:800;color:var(--roxo-texto);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.priv p.priv__rodape{margin-top:28px;padding-top:16px;border-top:1px solid var(--linha-card);font-weight:600;font-size:15px;line-height:1.5;color:var(--texto-3)}
.priv__voltar{margin-top:22px}
.pagina-priv .logo--p{margin-bottom:22px}
.priv .nobr{white-space:nowrap}

/* Carregando */
.carregando{display:flex;flex-direction:column;align-items:center;padding-top:118px}
.anel-carregando{width:210px;height:210px}
.anel-carregando .giro{transform-origin:110px 110px;animation:gira 1.4s linear infinite}
.carregando__titulo{margin-top:28px;font-weight:900;font-size:28px;letter-spacing:-.015em}
.checklist{display:flex;flex-direction:column;gap:16px;width:260px;margin-top:30px;list-style:none}
.checklist li{display:flex;align-items:center;gap:14px;font-weight:700;font-size:20px;color:#A6ABB4}
.checklist li.ok,.checklist li.agora{color:var(--tinta)}
.checklist .st{flex:0 0 28px;width:28px;height:28px;display:grid;place-items:center;border:2px solid #D5D9E2;border-radius:50%}
.checklist .st svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.checklist li.ok .st{border:0;background:var(--grad)}
.checklist li.agora .st{border:3px solid #E6DEFF;border-top-color:#8A5CFF;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.anel-carregando .giro,.checklist li.agora .st{animation:none}}

/* Mapa */
.logo--p{height:22px;margin:4px 0 0}
.mapa-titulo{margin-top:24px;font-weight:900;font-size:31px;line-height:1.14;letter-spacing:-.02em}
.mapa-data{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:700;font-size:17px;color:var(--texto-3)}
.mapa-data .ic{width:20px;height:20px}
.mapa-aviso{display:flex;align-items:flex-start;gap:12px;margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--lavanda);
  font-weight:600;font-size:16px;line-height:1.45;color:var(--texto-2)}
.mapa-aviso .ic{margin-top:1px;color:var(--icone)}
.cards{display:flex;flex-direction:column;gap:14px;margin-top:22px}

.pilar,.bloco{padding:18px 18px 20px;border:2px solid var(--linha-card);border-radius:var(--raio-card);background:#fff;box-shadow:var(--sombra-card)}
.pilar--alto{border-color:var(--alto-borda)}
.pilar--atencao{border-color:var(--atencao-borda)}
.pilar__cab,.bloco__cab{display:flex;align-items:center;gap:12px}
.pilar__ic{flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(106,84,255,.25)}
.pilar__ic .ic{width:26px;height:26px;stroke-width:1.9}
.pilar__meio{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.pilar__nome{font-weight:900;font-size:20px;line-height:1.15;letter-spacing:-.01em}
.pilar__texto,.bloco__texto{margin-top:14px;font-weight:500;font-size:18px;line-height:1.55;color:var(--texto-2)}
.medidor{flex:0 0 64px;width:64px;height:38px}

/* Selo de nível: texto + barrinhas (não depende só da cor) */
.selo{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 10px;border-radius:999px;font-weight:900;font-size:14px;letter-spacing:.07em}
.selo__barras{display:inline-flex;align-items:flex-end;gap:2px}
.selo__barras i{display:block;width:4px;border-radius:2px;background:currentColor;opacity:.25}
.selo__barras i:nth-child(1){height:7px}
.selo__barras i:nth-child(2){height:10px}
.selo__barras i:nth-child(3){height:13px}
.selo--baixo{background:var(--baixo-bg);color:var(--baixo-tx)}
.selo--baixo .selo__barras i:nth-child(1){opacity:1}
.selo--atencao{background:var(--atencao-bg);color:var(--atencao-tx)}
.selo--atencao .selo__barras i:nth-child(-n+2){opacity:1}
.selo--alto{background:var(--alto-bg);color:var(--alto-tx)}
.selo--alto .selo__barras i{opacity:1}

.bloco__ic{flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--lavanda);color:var(--icone)}
.bloco__ic .ic{width:26px;height:26px}
.bloco__titulo{font-weight:900;font-size:20px;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:6px 14px;border-radius:999px;background:var(--lavanda);font-weight:800;font-size:16px;color:#4A2BB8}
.chip .ic{width:18px;height:18px}

.cta{position:relative;overflow:hidden;margin-top:8px;padding:24px 16px 16px;border-radius:28px;background:var(--grad);color:#fff;box-shadow:0 18px 40px rgba(106,84,255,.30)}
.cta__raios{position:absolute;top:-122px;right:-122px;width:230px;height:230px;opacity:.3;pointer-events:none}
.cta__texto{position:relative;padding:0 28px 0 4px;font-weight:900;font-size:23px;line-height:1.3;letter-spacing:-.01em}
.cta .btn{position:relative;margin-top:18px;padding:14px 16px;font-size:19px}
.legal{margin-top:18px;padding:0 6px;font-weight:600;font-size:15px;line-height:1.5;text-align:center;color:var(--texto-3)}

@media (max-width:374px){.cta .btn{font-size:17px}.btn--secundario{font-size:16px}}

/* Barra fixa "Agendar" no resultado: aparece depois do cabeçalho e some quando o bloco .cta entra na tela */
.barra-cta{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 24px;border-top:1px solid var(--linha-card);background:#fff;box-shadow:0 -10px 30px rgba(38,56,110,.10)}

/* Aviso "Tem mais opções abaixo": entra no .rodape, acima do botão, só quando a última opção está escondida atrás dele.
   Tocar rola até o fim. */
.mais-opcoes{display:flex;align-items:center;justify-content:center;gap:6px;width:max-content;min-height:38px;margin:0 auto 10px;padding:6px 16px;
  border:0;border-radius:999px;background:var(--lavanda);box-shadow:0 4px 14px rgba(106,84,255,.18);font-weight:800;font-size:16px;color:var(--roxo-texto);cursor:pointer}
.mais-opcoes .ic{width:20px;height:20px;stroke-width:2.4;animation:desce 1.4s ease-in-out infinite}
@keyframes desce{50%{transform:translateY(3px)}}
@media (prefers-reduced-motion:reduce){.mais-opcoes .ic{animation:none}}

/* Telas baixas (navegador dentro do WhatsApp tira 150-280px da altura): mesma tela, mais compacta, pras opções
   caberem acima do botão. Medido em 360x640, 360x680, 375x560, 390x664 e 412x800. */
@media (max-height:760px){
  .topo{height:46px}
  .pergunta{margin-top:16px;font-size:26px}
  .ajuda{margin-top:6px}
  .opcoes{gap:8px;margin-top:14px}
  .opcao{min-height:54px;padding:10px 16px}
  .rodape{padding-top:12px}
  .btn{min-height:56px}
  .campos{gap:16px;margin-top:18px}
  .campo__rotulo{margin-bottom:8px}
  .campo__caixa{height:58px}
  .nota{margin-top:16px}
}
@media (max-height:760px){
  .consent-wrap{margin-top:14px}
  .consent{gap:12px;padding:12px 14px 12px 12px}
  .consent input{left:12px;top:13px}
  .consent__texto{font-size:17px;line-height:1.45}
}
@media (max-height:700px){
  .painel{top:12px}
  .painel__topo{height:54px}
  .priv h1{font-size:25px}
}
@media (max-height:680px){
  .pergunta{margin-top:12px;font-size:24px}
  .opcoes{gap:6px;margin-top:12px}
}
@media (max-height:700px){

/* css_resultado-animado_raio.css */
/* =========================================================================
   Raio-x animado no resultado do Mapa de Risco (vem depois do mapa.css)

   O HTML do card é o mesmo nas 3 variações; muda só a classe do container:
     .estilo-janela  V1  janela de raio-x dentro do card claro
     .estilo-lente   V2  corpo inteiro no topo (.corpo-hero) + lente redonda no card
     .estilo-escuro  V3  card escuro com o corpo à direita

   Sem style inline (CSP do app): posição, máscara e atraso ficam aqui, por classe.
   O raio.js só põe .anima no <html>, .visto quando o bloco entra na tela e
   .pausa quando ele sai (os loops param fora da tela e não gastam bateria).
   ========================================================================= */

:root{
  --alto-luz:#FF6A5C;
  --atencao-luz:#FFB52E;
  --baixo-luz:#36D77F;
  --raio-fundo:#07080B;
}

/* ---------- janela de raio-x ---------- */
.raio{position:relative;overflow:hidden;background:var(--raio-fundo);isolation:isolate;--ox:50%;--oy:50%;--z:1}
/* A cena tem a proporção da imagem: o que precisa casar com o corpo (máscara, faíscas, anéis) fica dentro dela.
   --ox/--oy: ponto do corpo que fica no centro da janela; --z: zoom (a lente da V2 usa). */
.raio__cena{position:absolute;left:50%;top:50%;width:100%;aspect-ratio:4/5;
  transform:translate(calc(var(--ox) * -1),calc(var(--oy) * -1)) scale(var(--z));transform-origin:var(--ox) var(--oy)}
.raio--cheio .raio__cena{aspect-ratio:3/4}
.raio__cena img{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;display:block}
.raio::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(115% 85% at 50% 45%,rgba(0,0,0,0) 58%,rgba(0,0,0,.5) 100%)}

/* cantoneiras de visor */
.raio__mira{position:absolute;inset:7px;z-index:2;pointer-events:none;opacity:.55;--c:rgba(255,255,255,.75);--t:1.5px;--l:11px;
  background:
    linear-gradient(var(--c),var(--c)) 0 0/var(--l) var(--t),linear-gradient(var(--c),var(--c)) 0 0/var(--t) var(--l),
    linear-gradient(var(--c),var(--c)) 100% 0/var(--l) var(--t),linear-gradient(var(--c),var(--c)) 100% 0/var(--t) var(--l),
    linear-gradient(var(--c),var(--c)) 0 100%/var(--l) var(--t),linear-gradient(var(--c),var(--c)) 0 100%/var(--t) var(--l),
    linear-gradient(var(--c),var(--c)) 100% 100%/var(--l) var(--t),linear-gradient(var(--c),var(--c)) 100% 100%/var(--t) var(--l);
  background-repeat:no-repeat}

/* linha de varredura (só na entrada) */
.raio__scan{position:absolute;left:0;right:0;top:0;z-index:2;height:28%;pointer-events:none;opacity:0;transform:translateY(-100%);
  background:linear-gradient(180deg,rgba(110,170,255,0) 0%,rgba(110,170,255,.16) 78%,rgba(205,230,255,.95) 97%,rgba(205,230,255,0) 100%)}

/* ---------- órgão destacado ---------- */
.org{position:absolute;inset:0}
.org--alto{--luz:var(--alto-luz)}
.org--atencao{--luz:var(--atencao-luz)}
.org--baixo{--luz:var(--baixo-luz)}
.org__img{opacity:.92}
.org__brilho{filter:blur(var(--blur,6px)) saturate(1.5);mix-blend-mode:screen;opacity:.4}
.org--sono .org__img,.org--sono .org__brilho{transform-origin:50% var(--resp-y,14%)}

/* sangue / sinal descendo: uma fatia do próprio órgão, clareada, desce pela janela.
   A fatia (.org__faixa) desce e a imagem dentro dela sobe na mesma medida, então o órgão fica parado e só a luz anda.
   Máscara só com degradê (sem url): funciona até abrindo o arquivo direto, sem servidor. */
.org__fluxo{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.org__faixa{position:absolute;left:0;right:0;top:0;height:38%;overflow:hidden;opacity:0;transform:translateY(-100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 42%,#000 58%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 42%,#000 58%,transparent 100%)}
.org__faixa-cena{position:absolute;left:0;top:0;width:100%;height:263.16%;transform:translateY(38%)}
.org__faixa-cena img{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;filter:brightness(2.2) saturate(.35)}

/* emocional: faíscas no cérebro (a caixa .org__faiscas é o contorno do cérebro, posição no fim do arquivo) */
.org__faiscas{position:absolute;pointer-events:none}
.org__faiscas i{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#fff;
  box-shadow:0 0 5px 2px var(--luz);opacity:0}
.org__faiscas i:nth-child(1){left:22%;top:42%;--fd:0s}
.org__faiscas i:nth-child(2){left:66%;top:22%;--fd:.35s}
.org__faiscas i:nth-child(3){left:44%;top:58%;--fd:.7s}
.org__faiscas i:nth-child(4){left:80%;top:52%;--fd:.2s}
.org__faiscas i:nth-child(5){left:34%;top:18%;--fd:.55s}
.org__faiscas i:nth-child(6){left:58%;top:76%;--fd:.9s}
.org__faiscas i:nth-child(7){left:14%;top:66%;--fd:1.1s}
.org--atencao .org__faiscas i:nth-child(n+5),.org--baixo .org__faiscas{display:none}

/* hormônio: anel que se espalha em cada glândula (o <i> segura a força, o <b> anima) */
.org__aneis i{position:absolute;width:0;height:0}
.org__aneis b{position:absolute;left:0;top:0;width:var(--anel,30px);height:var(--anel,30px);margin:calc(var(--anel,30px) / -2) 0 0 calc(var(--anel,30px) / -2);
  border-radius:50%;border:2px solid var(--luz);box-shadow:0 0 8px var(--luz);opacity:0}
.org__aneis i:nth-child(1){--ad:0s}
.org__aneis i:nth-child(2){--ad:.35s}
.org__aneis i:nth-child(3),.org__aneis i:nth-child(4){--ad:.75s}
/* ALTO: o sinal enfraquece no caminho */
.org--alto .org__aneis i:nth-child(2){opacity:.7}
.org--alto .org__aneis i:nth-child(n+3){opacity:.42}

/* ---------- entrada (só com JS: sem ele, tudo aparece pronto) ---------- */
.anima .rc,.anima .bl{opacity:0;transform:translateY(26px)}
.anima .rc.visto,.anima .bl.visto{animation:card-entra .7s cubic-bezier(.2,.75,.2,1) both}
.anima .raio__base{opacity:0}
.anima .visto .raio__base{animation:base-entra .7s .12s ease-out both}
.anima .visto .raio__scan{animation:scan 1.3s .2s cubic-bezier(.45,0,.55,1) both}
.anima .org__img,.anima .org__brilho{opacity:0}

.anima .visto .selo{animation:selo-pop .5s .55s cubic-bezier(.3,1.6,.5,1) both}
.anima .visto .selo__barras i{animation:barra .28s both;transform-origin:50% 100%}
.anima .visto .selo__barras i:nth-child(1){animation-delay:.75s}
.anima .visto .selo__barras i:nth-child(2){animation-delay:.85s}
.anima .visto .selo__barras i:nth-child(3){animation-delay:.95s}
.anima .medidor .arco{stroke-dasharray:1 1;stroke-dashoffset:1}
.anima .visto .medidor .arco{animation:arco .35s ease-out both}
.anima .visto .medidor .arco--baixo{animation-delay:.4s}
.anima .visto .medidor .arco--atencao{animation-delay:.52s}
.anima .visto .medidor .arco--alto{animation-delay:.64s}
.medidor__agulha{transform-box:view-box;transform-origin:50px 52px}
.anima .visto .medidor--alto .medidor__agulha{animation:agulha-alto 1.3s .6s cubic-bezier(.3,1.3,.45,1) both}
.anima .visto .medidor--atencao .medidor__agulha{animation:agulha-atencao 1.3s .6s cubic-bezier(.3,1.3,.45,1) both}
.anima .visto .medidor--baixo .medidor__agulha{animation:agulha-baixo 1.1s .6s cubic-bezier(.3,1.3,.45,1) both}

/* ---------- medidor vivo (Elias, 22/10: "o ponteiro tem que ficar animado também, a cor que parar ficar viva ou neon") ----------
   O ponteiro varre até o nível e fica vivo: treme no vermelho, balança no âmbar, respira no verde.
   O arco onde ele para acende em neon (cópia do arco em cor "luz" com o filtro #f-neon) e pulsa no mesmo ritmo. */
.svg-defs{position:absolute;width:0;height:0;overflow:hidden}
.medidor{overflow:visible}
.arco-neon{opacity:.9}
.medidor__vibra{transform-box:view-box;transform-origin:50px 52px}
.anima .arco-neon{opacity:0}
.visto .medidor--alto .arco-neon{animation:neon-acende .45s 1.5s ease-out both,neon-pulsa-alto .9s 1.95s ease-in-out infinite}
.visto .medidor--atencao .arco-neon{animation:neon-acende .5s 1.5s ease-out both,neon-pulsa 2.4s 2s ease-in-out infinite}
.visto .medidor--baixo .arco-neon{animation:neon-acende .6s 1.35s ease-out both,neon-pulsa 3.6s 1.95s ease-in-out infinite}
.visto .medidor--alto .medidor__vibra{animation:vibra-alto .9s 1.95s ease-in-out infinite}
.visto .medidor--atencao .medidor__vibra{animation:vibra-atencao 2.4s 2s ease-in-out infinite}
.visto .medidor--baixo .medidor__vibra{animation:vibra-baixo 3.6s 1.95s ease-in-out infinite}
@keyframes neon-acende{from{opacity:0}to{opacity:1}}
@keyframes neon-pulsa{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes neon-pulsa-alto{0%,55%,100%{opacity:1}25%{opacity:.55}75%{opacity:.7}}
/* no vermelho o ponteiro força pro fim da escala (sentido horário); nos outros, vai e volta em torno do nível */
@keyframes vibra-alto{0%,100%{transform:rotate(0)}20%{transform:rotate(5deg)}35%{transform:rotate(1.5deg)}55%{transform:rotate(6deg)}75%{transform:rotate(1deg)}}
@keyframes vibra-atencao{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes vibra-baixo{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}

/* ---------- textos do resultado (Elias, 22/10: "esses textos têm que estar alinhados também, e com cor em destaques em palavras-chave") ----------
   Justificado (as duas margens retas). Os pontos de quebra (hífen opcional nas palavras longas) vêm do build, pra quebrar
   igual em todo navegador e não abrir buraco entre as palavras.
   Palavra-chave (.dq, marcada no build): negrito e cor do nível no card do pilar; cor da marca nos blocos e no aviso do topo. */
.pilar__texto,.bloco__texto,.mapa-aviso>span{text-align:justify;-webkit-hyphens:manual;hyphens:manual}
.dq{font-weight:800}
.pilar--alto .dq{color:#C42B20}
.pilar--atencao .dq{color:#B45309}
.pilar--baixo .dq{color:#15803D}
.bloco .dq,.mapa-aviso .dq{color:var(--link,#5B2BD9)}
.estilo-escuro .pilar--alto .dq{color:#FF7A6E}
.estilo-escuro .pilar--atencao .dq{color:#FFB52E}
.estilo-escuro .pilar--baixo .dq{color:#4ADE80}
.anima .visto .chip{animation:selo-pop .45s cubic-bezier(.3,1.5,.5,1) both}
.anima .visto .chip:nth-child(1){animation-delay:.35s}
.anima .visto .chip:nth-child(2){animation-delay:.47s}
.anima .visto .chip:nth-child(3){animation-delay:.59s}
.anima .visto .chip:nth-child(n+4){animation-delay:.71s}

/* ---------- órgão: acende na entrada e depois fica em loop pelo nível ----------
   --d = atraso pra acender (o corpo do topo da V2 acende um órgão de cada vez, quando a varredura passa) */
.visto .org--alto .org__img{animation:acende .5s var(--d,.55s) ease-out both,orgao-alto 1.2s calc(var(--d,.55s) + .5s) ease-in-out infinite}
.visto .org--alto .org__brilho{animation:acende-brilho .6s var(--d,.55s) ease-out both,brilho-alto 1.2s calc(var(--d,.55s) + .5s) ease-in-out infinite}
.visto .org--atencao .org__img{animation:acende .6s var(--d,.55s) ease-out both,orgao-atencao 2.8s calc(var(--d,.55s) + .6s) ease-in-out infinite}
.visto .org--atencao .org__brilho{animation:acende-brilho .7s var(--d,.55s) ease-out both,brilho-atencao 2.8s calc(var(--d,.55s) + .6s) ease-in-out infinite}
.visto .org--baixo .org__img{animation:acende .8s var(--d,.55s) ease-out both,orgao-baixo 5s calc(var(--d,.55s) + .8s) ease-in-out infinite}
.visto .org--baixo .org__brilho{animation:acende-brilho .8s var(--d,.55s) ease-out both,brilho-baixo 5s calc(var(--d,.55s) + .8s) ease-in-out infinite}

/* sono: respiração no lugar do pulso. ALTO = duas respirações e uma pausa longa (ronco/apneia) */
.visto .org--sono.org--alto .org__img{animation:acende .5s var(--d,.55s) ease-out both,resp-alto 6s calc(var(--d,.55s) + .5s) ease-in-out infinite}
.visto .org--sono.org--alto .org__brilho{animation:acende-brilho .6s var(--d,.55s) ease-out both,resp-alto-brilho 6s calc(var(--d,.55s) + .5s) ease-in-out infinite}
.visto .org--sono.org--atencao .org__img{animation:acende .6s var(--d,.55s) ease-out both,resp-atencao 4.6s calc(var(--d,.55s) + .6s) ease-in-out infinite}
.visto .org--sono.org--atencao .org__brilho{animation:acende-brilho .7s var(--d,.55s) ease-out both,resp-atencao-brilho 4.6s calc(var(--d,.55s) + .6s) ease-in-out infinite}
.visto .org--sono.org--baixo .org__img{animation:acende .8s var(--d,.55s) ease-out both,resp-baixo 4.2s calc(var(--d,.55s) + .8s) ease-in-out infinite}
.visto .org--sono.org--baixo .org__brilho{animation:acende-brilho .8s var(--d,.55s) ease-out both,resp-baixo-brilho 4.2s calc(var(--d,.55s) + .8s) ease-in-out infinite}

/* circulação e hormônio: faixa descendo. ALTO morre no meio do caminho ("fecham o caminho"); BAIXO chega até o fim */
.visto .org--alto .org__faixa{animation:fluxo-alto 2.4s calc(var(--d,.55s) + .5s) ease-in infinite}
.visto .org--alto .org__faixa-cena{animation:fluxo-alto-img 2.4s calc(var(--d,.55s) + .5s) ease-in infinite}
.visto .org--atencao .org__faixa{animation:fluxo-atencao 2.8s calc(var(--d,.55s) + .6s) ease-in-out infinite}
.visto .org--atencao .org__faixa-cena{animation:fluxo-atencao-img 2.8s calc(var(--d,.55s) + .6s) ease-in-out infinite}
.visto .org--baixo .org__faixa{animation:fluxo-baixo 3.4s calc(var(--d,.55s) + .8s) linear infinite}
.visto .org--baixo .org__faixa-cena{animation:fluxo-baixo-img 3.4s calc(var(--d,.55s) + .8s) linear infinite}
.visto .org--alto .org__faiscas i{animation:faisca .9s calc(var(--d,.55s) + .5s + var(--fd,0s)) ease-in-out infinite}
.visto .org--atencao .org__faiscas i{animation:faisca 1.9s calc(var(--d,.55s) + .6s + var(--fd,0s)) ease-in-out infinite}
.visto .org--alto .org__aneis b{animation:anel 1.9s calc(var(--d,.55s) + .4s + var(--ad,0s)) ease-out infinite}
.visto .org--atencao .org__aneis b{animation:anel 2.6s calc(var(--d,.55s) + .5s + var(--ad,0s)) ease-out infinite}
.visto .org--baixo .org__aneis b{animation:anel 3.6s calc(var(--d,.55s) + .8s + var(--ad,0s)) ease-out infinite}

/* ---------- convergência (corpo do topo): linhas de cada órgão aceso descem até a região masculina ----------
   Pedido do Elias (22/10): "todos os sintomas do corpo convergindo pra lá, dando a entender que a soma de tudo causa o problema lá".
   As curvas e os quadros das gotas são gerados pelo build_variacoes.py (no bloco de posições, no fim do arquivo). */
.conv{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.conv__linha{fill:none;stroke:var(--luz);stroke-width:1.5;stroke-linecap:round;opacity:.9;stroke-dasharray:1 1;stroke-dashoffset:0}
.conv__linha--alto,.conv__gota--alto,.conv__alvo--alto,.conv__ponto--alto{--luz:var(--alto-luz)}
.conv__linha--atencao,.conv__gota--atencao,.conv__alvo--atencao,.conv__ponto--atencao{--luz:var(--atencao-luz)}
.conv__linha--baixo,.conv__gota--baixo,.conv__alvo--baixo,.conv__ponto--baixo{--luz:var(--baixo-luz)}
.conv__gota{position:absolute;z-index:1;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px var(--luz);opacity:0}
.conv__alvo{position:absolute;aspect-ratio:1;border-radius:50%;border:2px solid var(--luz);opacity:0;transform:translate(-50%,-50%)}
.conv__ponto{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--luz);box-shadow:0 0 0 3px rgba(7,8,11,.55),0 0 12px var(--luz);opacity:0}
.anima .conv__linha{stroke-dashoffset:1}
.visto .conv__linha{animation:conv-desenha .95s var(--cd,1.3s) cubic-bezier(.45,0,.25,1) both}
.visto .conv__gota{animation-duration:1.6s;animation-timing-function:cubic-bezier(.5,0,.8,1);animation-iteration-count:infinite;animation-fill-mode:both;
  animation-delay:calc(var(--cd,1.3s) + .55s)}
.visto .conv__gota--2{animation-delay:calc(var(--cd,1.3s) + 1.35s)}
.visto .conv__ponto{animation:base-entra .4s 2.4s ease-out both}
.visto .conv__alvo{animation:conv-alvo 1.6s 2.45s ease-out infinite}
@keyframes conv-desenha{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes conv-alvo{0%{opacity:.9;transform:translate(-50%,-50%) scale(.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.org--masculino .org__img{opacity:.95}

/* ---------- corpo chegando do carregando (o JS põe .chega e faz ele deslizar da janela até aqui) ----------
   A base e os órgãos dos pilares já chegam acesos (eram os mesmos da janela) e a varredura não repete. A revelação
   (alfinetes, linhas e a região masculina) começa quando ele assenta: o JS só liga o .visto depois. */
.anima .corpo-hero.chega .raio__base{opacity:1;animation:none}
.corpo-hero.chega .raio__scan{display:none}
.anima .corpo-hero.chega:not(.visto) .org:not(.org--masculino) .org__img{opacity:.88}
.anima .corpo-hero.chega:not(.visto) .org:not(.org--masculino) .org__brilho{opacity:.35}
.corpo-hero.chega .org:not(.org--masculino){--d:-.5s}

/* ---------- bloco de agendar (Elias, 22/10: "o botão de agendar tem que ficar em destaque pulsando lá embaixo, e tem que ter
   o botão do WhatsApp") ----------
   O "Agendar" pulsa: um anel que se espalha e um leve batimento. O WhatsApp vem embaixo dele, contornado, pra não disputar.
   A barra fixa "Agendar" (que aparece rolando) pulsa igual. --pulso = cor do anel em R,G,B. */
.cta .btn--branco,.barra-cta .btn--primario{animation:cta-pulso 2.2s ease-out infinite}
.cta{--pulso:255,255,255}
/* "Agendar minha consulta" METÁLICO em azul claro (Elias, 23/10: "o botão de agendar consulta eu quero meio que um azul claro,
   mas mesmo estilo"). O estilo é o do dourado que ele aprovou em 22/10 a partir de um print: degradê na horizontal com reflexo
   (cor → reflexo quase branco → cor → claro), moldura escura em volta e texto escuro. A cor é o ciano da AndroClinic (#3FC6FF);
   moldura e texto em azul-marinho (texto 7,8:1 no ciano). A moldura é borda (o contorno fica livre pro foco do teclado, e o anel
   do pulso é box-shadow). No bloco do fim e na barra fixa (é o mesmo botão). A cor D (preto e amarelo) fica como estava. */
.tela:not(.tema-preto) .cta .btn--branco,.tela:not(.tema-preto) .barra-cta .btn--primario{
  background:linear-gradient(90deg,#3FC6FF 0%,#E4F8FF 31%,#3FC6FF 71%,#C2ECFF 100%);color:#0A2540;border:3px solid #0E2C4A;
  padding-left:12px;padding-right:12px}
/* com a moldura, "Agendar minha consulta" quebrava em 2 linhas nos celulares de 375 a 390px: a letra acompanha a largura
   (19px a partir de 413px, ~18px em 390, 16,5px em 360) e o texto cabe numa linha só */
.tela:not(.tema-preto) .cta .btn--branco{font-size:clamp(16.5px,4.6vw,19px)}
.tela:not(.tema-preto) .cta,.tela:not(.tema-preto) .barra-cta{--pulso:63,198,255}
.barra-cta{--pulso:47,107,224}
.tela:not(.tema-solido) .barra-cta{--pulso:123,92,255}
.tema-laudo .barra-cta{--pulso:21,24,28}

/* =========================================================================
   V1 · janela de raio-x no card claro
   ========================================================================= */
.estilo-janela .rc{display:grid;grid-template-columns:118px minmax(0,1fr);column-gap:14px;padding:14px 16px 18px 14px}
.estilo-janela .rc .raio{grid-column:1;grid-row:1;width:118px;aspect-ratio:4/5;border-radius:16px;--anel:24px;box-shadow:0 8px 18px rgba(10,14,40,.22)}
.estilo-janela .pilar__info{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px}
.estilo-janela .pilar__texto{grid-column:1/-1;grid-row:2;margin-top:14px}
.estilo-janela .medidor{margin-top:2px}

/* =========================================================================
   V2 · corpo inteiro no topo + lente redonda no card
   ========================================================================= */
.corpo-hero{position:relative;margin-top:20px;border-radius:26px;overflow:hidden;background:var(--raio-fundo);aspect-ratio:3/4;
  box-shadow:0 18px 40px rgba(10,12,30,.28)}
.corpo-hero .raio{position:absolute;inset:0}
.corpo-hero .raio::after{background:linear-gradient(0deg,var(--raio-fundo) 0%,rgba(7,8,11,0) 16%),
  radial-gradient(120% 80% at 50% 40%,rgba(0,0,0,0) 60%,rgba(0,0,0,.45) 100%)}
.corpo-hero .raio__scan{height:16%}
.anima .corpo-hero.visto .raio__scan{animation:scan-cheio 1.9s .15s cubic-bezier(.4,0,.6,1) both}
@keyframes scan-cheio{0%{opacity:0;transform:translateY(-100%)}8%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(640%)}}
.corpo-hero{--blur:7px}

/* alfinetes: caixa de um lado, linha até o órgão */
.pino{position:absolute;left:0;right:0;height:0;z-index:3}
.pino--alto{--luz:var(--alto-luz)}
.pino--atencao{--luz:var(--atencao-luz)}
.pino--baixo{--luz:var(--baixo-luz)}
.pino__caixa{position:absolute;top:0;display:flex;flex-direction:column;gap:3px;max-width:calc(36% - 10px);padding:7px 11px 8px;border-radius:12px;
  background:rgba(10,12,16,.8);border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 18px rgba(0,0,0,.35);transform:translateY(-50%)}
.pino--esq .pino__caixa{right:64%}
.pino--dir .pino__caixa{left:64%}
.pino__caixa b{font-weight:800;font-size:14px;line-height:1.15;color:#fff}
.pino__caixa em{display:flex;align-items:center;gap:6px;font-style:normal;font-weight:900;font-size:12px;line-height:1.2;letter-spacing:.07em;color:var(--luz)}
.pino__caixa em i{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:var(--luz);box-shadow:0 0 6px var(--luz)}
.pino__linha{position:absolute;top:-.75px;height:1.5px;background:var(--luz);opacity:.85}
.pino--esq .pino__linha{left:36%;right:calc(100% - var(--ax));transform-origin:0 50%}
.pino--dir .pino__linha{left:var(--ax);right:36%;transform-origin:100% 50%}
.pino__alvo{position:absolute;top:0;left:var(--ax);width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--luz);box-shadow:0 0 0 3px rgba(7,8,11,.55),0 0 10px var(--luz)}
.pino__alvo::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--luz);opacity:0}
.anima .pino{opacity:0}
.anima .corpo-hero.visto .pino{animation:base-entra .3s var(--pd,1s) ease-out both}
.anima .corpo-hero.visto .pino__caixa{animation:pino-caixa .5s var(--pd,1s) cubic-bezier(.3,1.5,.5,1) both}
.anima .corpo-hero.visto .pino__linha{animation:pino-linha .35s var(--pd,1s) ease-out both}
.corpo-hero.visto .pino--alto .pino__alvo::after{animation:alvo 1.2s calc(var(--pd,1s) + .3s) ease-out infinite}
.corpo-hero.visto .pino--atencao .pino__alvo::after{animation:alvo 2.2s calc(var(--pd,1s) + .3s) ease-out infinite}
@keyframes pino-caixa{from{opacity:0;transform:translateY(-50%) scale(.82)}to{opacity:1;transform:translateY(-50%) scale(1)}}
@keyframes pino-linha{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes alvo{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}

/* lente no card: mesma janela, redonda e com zoom no órgão */
.estilo-lente .rc{display:grid;grid-template-columns:54px minmax(0,1fr) auto;column-gap:12px;row-gap:7px;align-items:center}
.estilo-lente .rc .raio{grid-column:1;grid-row:1/3;width:54px;height:54px;border-radius:50%;--anel:18px;
  box-shadow:0 0 0 2px var(--anel-cor,#E3E6EE),0 6px 14px rgba(10,12,30,.25)}
.estilo-lente .pilar--alto{--anel-cor:var(--alto)}
.estilo-lente .pilar--atencao{--anel-cor:var(--atencao)}
.estilo-lente .pilar--baixo{--anel-cor:var(--baixo)}
.estilo-lente .pilar__info{display:contents}
.estilo-lente .pilar__nome{grid-column:2;grid-row:1;align-self:end}
.estilo-lente .selo{grid-column:2;grid-row:2;justify-self:start;align-self:start}
.estilo-lente .medidor{grid-column:3;grid-row:1/3}
.estilo-lente .pilar__texto{grid-column:1/-1;grid-row:3;margin-top:7px}
.estilo-lente .rc .raio__mira,.estilo-lente .rc .raio__scan,.estilo-lente .rc .raio::after{display:none}
.estilo-lente .rc .org__faiscas i{width:3px;height:3px;margin:-1.5px 0 0 -1.5px;box-shadow:0 0 3px 1px var(--luz)}
.estilo-lente .rc .org__aneis b{border-width:1px}

/* =========================================================================
   V3 · card escuro com o corpo à direita
   ========================================================================= */
.estilo-escuro .rc{position:relative;overflow:hidden;padding:0;background:#0D0F13;color:#fff;border-color:rgba(255,255,255,.08);
  box-shadow:0 16px 36px rgba(12,14,30,.22)}
.estilo-escuro .rc.pilar--alto{border-color:rgba(226,72,61,.6)}
.estilo-escuro .rc.pilar--atencao{border-color:rgba(240,169,27,.5)}
.estilo-escuro .rc.pilar--baixo{border-color:rgba(30,158,87,.45)}
.estilo-escuro .rc .raio{position:absolute;top:0;right:0;width:60%;height:228px;background:transparent;--blur:8px}
.estilo-escuro .rc .raio::after{background:linear-gradient(90deg,#0D0F13 0%,rgba(13,15,19,0) 42%),linear-gradient(0deg,#0D0F13 0%,rgba(13,15,19,0) 30%)}
.estilo-escuro .rc .raio__mira{display:none}
.estilo-escuro .pilar__info{position:relative;z-index:3;min-height:228px;width:56%;padding:20px 0 16px 20px;display:flex;flex-direction:column;
  justify-content:center;align-items:flex-start;gap:12px}
.estilo-escuro .pilar__nome{color:#fff;font-size:22px}
.estilo-escuro .pilar__texto{position:relative;z-index:3;margin:0;padding:0 20px 22px;color:#CDD2DA}
.estilo-escuro .medidor .arco:not(.ativo){stroke:rgba(255,255,255,.16)}
.estilo-escuro .medidor__agulha line{stroke:#fff}
.estilo-escuro .medidor__eixo{fill:#fff}
.estilo-escuro .medidor__furo{fill:#0D0F13}

/* ---------- movimento reduzido: tudo parado, já no estado final ---------- */
@media (prefers-reduced-motion:reduce){
  .raio *,.corpo-hero *,.rc,.bl{animation:none!important}
  .org__fluxo,.raio__scan,.org__faiscas,.org__aneis,.conv__gota,.conv__alvo{display:none}
  .arco-neon,.medidor__vibra{animation:none!important}
  .cta .btn--branco,.barra-cta .btn--primario{animation:none}
  .conv__ponto{opacity:1}
  .org__img{opacity:.95}
  .org__brilho{opacity:.45}
}
