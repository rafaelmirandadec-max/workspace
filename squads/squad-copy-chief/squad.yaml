pack:
  name: squad-copy-chief
  version: 1.0.0
  description: "Squad Copy Chief — copywriting de resposta direta pelo método de Clayton Makepeace (Quick-Start Copywriting System, vol. 1 e 2). Um Copy Chief coordena 10 agentes que produzem cada componente da promoção, da pesquisa à revisão. Independente do Arsenal de Funis."
  icon: "✒️"
  fonte: "Clayton Makepeace / AWAI — Quick-Start Copywriting System, Volumes 1 e 2 (23 capítulos)"
  coordenacao: "skill copy-chief (a conversa principal assume o papel de Copy Chief)"
  protocolo: "squads/squad-copy-chief/PROTOCOLO.md"
  created: "2026-11-03"
  updated: "2026-11-03"

agents:                    # capítulos do livro que cada um aplica
  - cc-pesquisador         # cap. 2 (e coleta dos caps. 4 e 20) — produto, prospect, mercado, concorrência, linguagem
  - cc-oferta              # caps. 3 e 18 (e 22) — oferta, tipos, 5W1H, brindes, valor, garantia
  - cc-beneficios-e-provas # caps. 4 e 5 — gráfico de benefícios, ranking, 18 provas
  - cc-estrategista        # caps. 6, 7, 8, 11, 13 e 21 — big idea, tema, consciência, sofisticação, A-B-C, voz e inimigo
  - cc-abertura            # caps. 9, 10 e 12 — headlines, emoção dominante, deck, 24 leads
  - cc-bullets             # cap. 16 (e 22) — 21 fórmulas, bullets cegos, Makepeace Makeover
  - cc-redator-corpo       # caps. 14 e 15 (e epílogo) — corpo, momentum, montagem da peça
  - cc-fechamento          # cap. 17 (e 18) — 6 elementos, 7 temas de fechamento, P.S.
  - cc-pecas-de-apoio      # cap. 19 — lift notes → boxes, FAQ, páginas satélite, e-mails, lançamento
  - cc-revisor-chefe       # todos os checklists + conformidade — revisão independente

skills:
  - copy-chief                     # coordenação (conversa principal)
  - cc-fundamentos                 # caps. 1 e 23 — resposta direta, anatomia da peça, controle e teste, 30%, glossário
  - cc-pesquisa                    # cap. 2
  - cc-oferta-e-garantia           # caps. 3 e 18
  - cc-beneficios                  # cap. 4
  - cc-prova                       # cap. 5
  - cc-big-idea-e-tema             # caps. 6, 7 e 13
  - cc-argumento-abc               # cap. 8
  - cc-headlines                   # caps. 9 e 10
  - cc-consciencia-e-sofisticacao  # cap. 11 (Breakthrough Advertising)
  - cc-leads                       # cap. 12
  - cc-corpo-e-momentum            # caps. 14 e 15
  - cc-bullets                     # cap. 16
  - cc-fechamento                  # cap. 17
  - cc-pecas-de-apoio              # cap. 19
  - cc-swipe-file                  # cap. 20
  - cc-vinculo-e-voz               # cap. 21
  - cc-infoproduto                 # cap. 22
  - cc-conformidade                # não vem do livro: adaptação às regras brasileiras

pasta_da_promocao: |
  promocoes/<cliente>/<promocao>/
    00-briefing.md · 01-pesquisa.md (+ 01-pesquisa/) · 02-oferta.md · 03-beneficios-e-provas.md
    04-plataforma.md · 05-abertura.md · 06-bullets.md · 07-fechamento.md · 08-apoio/
    09-peca-final.md · revisoes/

fluxos:
  promocao_completa:
    - "cc-pesquisador"
    - "cc-oferta ∥ cc-beneficios-e-provas"
    - "cc-estrategista"
    - "cc-abertura ∥ cc-bullets"
    - "cc-fechamento"
    - "cc-redator-corpo (montagem)"
    - "cc-revisor-chefe → ajustes"
    - "cc-pecas-de-apoio (se pedidas)"
  peca_pontual:
    - "agente da peça, com o que houver na pasta"
    - "cc-revisor-chefe"
  copy_que_nao_converte:
    - "cc-revisor-chefe (diagnóstico)"
    - "agente do componente mais fraco"

regras_comuns:
  - "Nenhuma fase bloqueia outra: trabalhar com o que existe e marcar FATO, PISTA, SUPOSIÇÃO, [A PREENCHER], [PROVA: …]"
  - "Gerar em volume, entregar só o que presta (quantidade é teto, não cota)"
  - "Nunca inventar prova, depoimento, número, estudo ou menção na mídia"
  - "Nicho regulado passa pela skill cc-conformidade e pelo cc-revisor-chefe"
