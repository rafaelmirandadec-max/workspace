pack:
  name: squad-arsenal
  version: 5.0.0
  description: "Arsenal de Funis — 10 agentes especialistas para funis de venda e conteúdo: pesquisa, público, oferta, funil e eventos, voz, copy, conteúdo orgânico, mídia paga, métricas e revisão. A coordenação é feita pela conversa principal (CLAUDE.md)."
  icon: "🎯"
  coordenacao: "CLAUDE.md na raiz do repositório"
  protocolo: "squads/squad-arsenal/PROTOCOLO.md"
  created: "2026-09-02"
  updated: "2026-10-16"

agents:
  - researcher          # Pesquisa de mercado, concorrentes, anúncios, linguagem do público, briefing
  - avatar-strategist   # Perfis (ICP), dores, consciência, sofisticação, objeções
  - offer-architect     # Promessa, mecanismo, stack, garantia, preço
  - funnel-architect    # Escada de valor, tipo de funil, mapa de ativos, eventos e imersões
  - brand-architect     # Posicionamento, tom de voz, Perfil de Comunicação, personagem atraente
  - copywriter          # Página, VSL, e-mail, anúncio, roteiro, ângulos
  - content-strategist  # Conteúdo orgânico: linha editorial, pilares, Reels, carrosséis
  - traffic-strategist  # Meta Ads e Google Ads: estrutura, públicos, criativos, verba
  - metrics-analyst     # KPIs, gargalo, unit economics, projeção, teste A/B
  - revisor             # Revisão independente: fatos, conformidade, coerência, texto

skills:
  - pesquisa-mercado             # Metodologia multi-fonte, citação literal, gaps, dossiê
  - briefing-arsenal             # Briefing e pasta do projeto
  - escada-de-valor              # Escada (inclusive para serviços), tipos de funil, maximizadores
  - imersao-e-eventos            # Masterclass, workshop, desafio, imersão; virada de chave
  - oferta-irresistivel          # Promessa, mecanismo, stack, bônus, garantia, preço
  - copywriting-resposta-direta  # Consciência, sofisticação, big idea, 8 motivações, estruturas
  - manifesto                    # Manifesto de marca, de convocação e credo; virada; roteiro falado
  - conteudo-organico            # Funil Conhece, Gosta, Confia, Compra; pilares; formatos
  - extracao-comunicacao         # Perfil de Comunicação (versão rápida ou completa)
  - trafego-e-anuncios           # Estrutura de conta, ângulos, criativo, verba, leitura
  - metricas-de-funil            # KPIs, fórmulas, cascata, volume mínimo, projeção
  - conformidade                 # Saúde, finanças, advocacia, CDC, LGPD, políticas de anúncio

pasta_do_projeto: |
  projetos/<cliente>/  (ou a pasta que o projeto já tem)
    00-briefing.md · 01-pesquisa/ · 02-avatar.md · 03-oferta.md · 04-funil.md
    05-voz.md · 06-copy/ · 07-conteudo/ · 08-midia.md · 09-metricas.md · revisoes/

fluxos:
  projeto_novo:
    - "researcher → pesquisa e briefing"
    - "avatar-strategist → perfis e consciência"
    - "offer-architect → oferta   (em paralelo: brand-architect → voz)"
    - "funnel-architect → arquitetura"
    - "copywriter e/ou content-strategist → peças"
    - "revisor → liberação"
    - "traffic-strategist → mídia"
    - "metrics-analyst → metas e acompanhamento"
  peca_pontual:
    - "copywriter ou content-strategist, com o que houver na pasta"
    - "revisor"
  conteudo_organico:
    - "researcher → buscas e comentários do público"
    - "avatar-strategist → perfis e níveis"
    - "content-strategist → linha editorial e pautas"
    - "revisor"
  evento:
    - "researcher → pesquisa do nicho"
    - "funnel-architect → arquitetura do evento (skill imersao-e-eventos)"
    - "offer-architect → oferta do palco"
    - "copywriter → convite, aquecimento, página e pós-evento"
  diagnostico:
    - "metrics-analyst → gargalo"
    - "agente da etapa → correção"

regras_comuns:
  - "Nenhuma fase bloqueia outra: trabalhar com o que existe e marcar FATO, PISTA, SUPOSIÇÃO, [A PREENCHER]"
  - "Quantidade é teto, não cota; nunca completar lista com material inventado"
  - "Nicho regulado passa pela skill conformidade e pelo revisor"
